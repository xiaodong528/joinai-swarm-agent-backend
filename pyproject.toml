[project]
name = "swarm-engine"
version = "0.1.0"
description = "Multi-session E2B OpenCode agent template generation engine."
requires-python = ">=3.11"
dependencies = [
  "e2b>=1.0.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
