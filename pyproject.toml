[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-e2b-backend"
version = "0.1.0"
description = "Provision OpenCode configuration inside E2B sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.112",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
e2b = ["e2b>=2.0"]

[tool.setuptools]
packages = ["opencode_backend"]

